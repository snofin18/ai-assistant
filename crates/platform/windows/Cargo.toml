[package]
name = "assistant-platform-windows"
description = "Windows platform provider: Win32 window enumeration + UI Automation (铁律 7 的实现侧)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# 第三方依赖登记：docs/DEPENDENCIES.md 的 `windows` 行（状态 = Approved，产品侧；ADR-0044）。
# 版本 =0.62.2 精确钉定 —— 升级 = 漂移触发器 ①。
# **target-gated**：非 Windows 目标（CI 的 macOS / ubuntu runner）不解析、不下载本依赖，
# 因此那些平台上的 `cargo test --workspace` 仍可编译本 crate（走 src/unsupported 后端）。
[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",             # HWND / LPARAM / WPARAM / BOOL
    "Win32_System_Com",             # CoInitializeEx / CoCreateInstance / CLSCTX_INPROC_SERVER
    "Win32_System_Ole",             # VARIANT（CreatePropertyCondition 的入参类型）
    "Win32_System_Threading",       # OpenProcess / QueryFullProcessImageNameW（owner PID -> 映像名）
    "Win32_System_Variant",         # VARIANT 所在模块
    "Win32_UI_Accessibility",       # IUIAutomation 全套客户端 COM 绑定（**不是** Win32_UI_UIAutomation！ADR-0024 D1a）
    "Win32_UI_WindowsAndMessaging", # EnumWindows / GetWindowThreadProcessId / SetForegroundWindow / IsIconic
] }

[dependencies.assistant-platform-api]
# 工作区内依赖（非第三方，无需登记）。必须同时写 `version`：deny.toml 的
# `[bans] wildcards = "deny"` 把"只有 path 没有 version"判为通配依赖。
path = "../api"
version = "0.1.0"

[lints]
workspace = true
