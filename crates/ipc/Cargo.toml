[package]
name = "assistant-ipc"
description = "Host IPC protocol: framing, authenticated handshake, heartbeat, and NamedPipe transport."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Third-party dependencies are registered in docs/DEPENDENCIES.md before use.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dependencies.assistant-protocol]
path = "../protocol"
version = "0.1.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[lints]
workspace = true
