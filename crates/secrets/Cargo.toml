[package]
name = "assistant-secrets"
description = "OS keychain wrapper: DPAPI / macOS Keychain / Secret Service via keyring, with zeroize + audited access."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# 第三方依赖：先登记后引入（docs/DEPENDENCIES.md 两行 Approved，人类 chat 2026-09-24 批准 TASK-014）。
#   keyring : OS 密钥库后端（架构 v2 §12.5 明文指定）；默认 feature `v1` = apple keychain +
#             windows-native + zbus-secret-service（zbus 是纯 Rust，ubuntu CI 不需要 libdbus）。
#   zeroize : 内存中的密钥用后清零（架构 v2 §12.5 明文指定）；volatile 写 + 屏障，防 dead-store 优化。
keyring = "4.2"
zeroize = "1.9"

[dependencies.assistant-protocol]
# 工作区内依赖（非第三方，无需登记）：复用 `ErrorCategory`（架构 v2 §8.7 的 13 类），
# 与 `crates/storage` / `crates/audit` 的错误映射保持同一口径。
# 必须同时写 `version`：deny.toml 的 `[bans] wildcards = "deny"` 会把"只有 path 没有 version"
# 判成通配依赖。
path = "../protocol"
version = "0.1.0"
[dependencies.assistant-storage]
# 工作区内依赖（非第三方，无需登记）：复用 storage 的 `Clock` 注入点，
# **不为密钥层再造第二个时钟 trait**（与 TASK-013 审计层同一理由）。
# 必须同时写 `version`：deny.toml 的 `[bans] wildcards = "deny"` 会把"只有 path 没有 version"
# 判成通配依赖。
path = "../storage"
version = "0.1.0"

[lints]
workspace = true
