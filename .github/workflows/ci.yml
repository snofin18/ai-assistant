# CI — gov §5.1 的门禁清单在机器上的表达。
#
# 上线策略（TASK-001）：
#   硬门禁 8 项（任一失败即阻塞合并）：fmt / clippy(含禁用项 lint) / test / deny / build / hygiene
#     / spike-deny / doc-consistency
#     （DRIFT-001-2-a 裁决确认：前 6 项 = 卡面原定 5 项 + hygiene；计数口径见
#      tasks/TASK-001-repo-skeleton.md §5.2。第 7 项 spike-deny 由 ADR-0024 D2 新增，
#      对应 gov §5.1 的 #8b —— 因为 spikes/ 被 workspace exclude，主 deny job 覆盖不到它。
#      第 8 项 doc-consistency 由 ADR-0030 新增，对应 gov §5.1 的 #12b —— 同样用子编号，
#      理由见该 job 上方的注释。）
#   元门禁（ADR-0019）：每项硬门禁都必须配一条「负向验证」，证明它在该红的时候真的会红。
#     canary 在 gate-selftest.yml（手工触发）；当前登记表见 ADR-0019，缺项见 PL-018。
#   软门禁 9 项（continue-on-error: true）：每一项都注明「启用卡号」，
#     到了那张卡就把它改成硬门禁，并删掉 continue-on-error。
#   为什么先软后硬：门禁必须在它检查的东西存在之后才有意义。
#     例如 arch test 检查 crates/core 的分层，而 crates/core 要到 TASK-015 才存在；
#     提前设成硬门禁只会得到一条永久红灯，而永久红灯会让人学会忽略 CI。
#
# 修改本文件的规则：把软门禁转硬 = 正常演进（在对应任务卡里做）；
#   把硬门禁转软或删除 = **放宽护栏**，属漂移触发器，需 ADR + 人类批准。

name: CI

on:
  push:
    branches: [main, "nightly/**", "task/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同一分支的新推送取消旧运行：省 runner，也避免"看错了一次运行结果"
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ==========================================================================
  # 三平台矩阵：硬门禁 1/2/3/4/10/12（gov §5.1 编号）
  # ==========================================================================
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # 工具链版本由 rust-toolchain.toml 固定，这里只负责装 rustup 与组件
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      # --- 硬门禁 #1：格式 ---
      - name: "[HARD #1] cargo fmt --check"
        run: cargo fmt --all --check

      # --- 硬门禁 #2 + #3：lint 零警告（#3 的禁用项由 Cargo.toml 的 [workspace.lints] 表达）---
      - name: "[HARD #2/#3] cargo clippy -D warnings"
        run: cargo clippy --all-targets -- -D warnings

      # --- 硬门禁 #4：单元测试 ---
      - name: "[HARD #4] cargo test"
        run: cargo test --workspace

      # --- 硬门禁 #10：构建（release，验证 LTO/strip 配置可用）---
      - name: "[HARD #10] cargo build --release"
        run: cargo build --release

      # --- 硬门禁 #12：仓库卫生 ---
      # 注：TASK-001 卡面写的是"先上线 5 项"，但 hygiene 在本卡已实现且自检通过，
      #     留作软门禁等于白白放弃一道已就绪的防线 → 记为 DRIFT-001-2，见任务卡执行记录。
      - name: "[HARD #12] xtask hygiene"
        run: cargo run -p xtask -- hygiene

      # =========================================================================
      # 软门禁：到了对应任务卡就转为硬门禁（删掉 continue-on-error）
      # =========================================================================

      # 启用卡号：TASK-015（需要 crates/core 存在）
      - name: "[SOFT #5 → TASK-015] arch test（分层依赖方向）"
        continue-on-error: true
        run: 'cargo test -p assistant-core arch::'

      # 启用卡号：TASK-011（需要 protocol crate 与五份 schema）
      - name: "[SOFT #6 → TASK-011] verify-schemas"
        continue-on-error: true
        run: cargo run -p xtask -- verify-schemas

      # 启用卡号：TASK-011
      - name: "[SOFT #7 → TASK-011] codegen --check"
        continue-on-error: true
        run: cargo run -p xtask -- codegen --check

      # 启用卡号：TASK-015（覆盖率门槛需要产品代码量足够才有意义）
      - name: "[SOFT #9 → TASK-015] coverage ≥ 75%"
        continue-on-error: true
        run: |
          cargo install cargo-llvm-cov --locked
          cargo llvm-cov --workspace --fail-under-lines 75

      # 启用卡号：TASK-015
      - name: "[SOFT #11 → TASK-015] cargo doc --no-deps"
        continue-on-error: true
        run: cargo doc --no-deps --workspace

      # 启用卡号：TASK-034（需要录制回放框架与快照 fixture）
      - name: "[SOFT #13 → TASK-034] replay --suite core"
        continue-on-error: true
        run: cargo run -p xtask -- replay --suite core

      # 启用卡号：待补卡（docs/PARKING_LOT.md PL-002）
      - name: "[SOFT #14 → 待补卡] commitlint（提交可追溯到任务卡）"
        continue-on-error: true
        run: echo "commitlint 尚未接入：需要先建立 node 侧工程（TASK-006）"

      # 启用卡号：待补卡（PL-002）
      - name: "[SOFT #15 → 待补卡] check-comments"
        continue-on-error: true
        run: cargo run -p xtask -- check-comments

      # 启用卡号：待补卡（PL-002）
      - name: "[SOFT #16 → 待补卡] check-ledger"
        continue-on-error: true
        run: cargo run -p xtask -- check-ledger

  # ==========================================================================
  # 硬门禁 #8：依赖治理（平台无关，单独一个 job 跑一次即可）
  # 负向验证（ADR-0019 N3）见 gate-selftest.yml：证明 deny.toml 解析失败时本 job 真的会红，
  # 而不是「配置读不进来 → 什么都没查 → 显示通过」。
  # ==========================================================================
  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 版本钉定（ADR-0019 / PL-016）：v2.1.1 这个 release 打包的就是 cargo-deny 0.20.2，
      # 与本地开发机、gate-selftest.yml 的 CARGO_DENY_VERSION 三者同版本。
      # 不要写 @v1 / @v2 这类会随上游漂移的引用 —— 那正是 deny.toml 缺陷被掩盖的根因之一。
      - uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          command: check
          arguments: --all-features

  # ==========================================================================
  # 硬门禁 #8b：spike 依赖治理（ADR-0024 D2，关闭 PL-019 方案 ①）
  #
  # 为什么单独一道：Cargo.toml 的 exclude = ["spikes", ...] 使主 deny job 覆盖不到 spike 代码，
  #   于是 spike 里 `cargo add` 任何依赖都只有政策约束（DEPENDENCIES.md 规则 1）、没有机器约束。
  # 为什么只查 licenses + sources：这两项不需要联网 clone advisory-db；而 spike 最真实的风险
  #   恰恰是「图方便引入许可证不兼容或来源不明的包」。bans 不查（spike 之间版本重复是正常的），
  #   advisories 不查（一次性验证代码不在发布链路上）。
  # 铁律 1：没有任何 spike manifest 时必须显式打印「无」再 exit 0，绝不静默通过。
  # 负向验证（ADR-0019 N3）见 gate-selftest.yml 的 spike-deny canary。
  # ==========================================================================
  spike-deny:
    name: cargo deny (spikes only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # 版本必须与 ci.yml 的 cargo-deny-action@v2.1.1 及本机开发环境同版本（ADR-0019 / PL-016）。
      # 注：这里用 cargo install 从源码编译（约 5 分钟）。TASK-015 应改为下载预编译二进制，
      #     与「软门禁 #9 覆盖率」的同类优化一起做。
      - name: "install cargo-deny (pinned, same version as the main deny job)"
        run: |
          set -euo pipefail
          cargo install cargo-deny --version 0.20.2 --locked
          cargo deny --version

      - name: "[HARD #8b] cargo deny check licenses sources (per spike manifest)"
        run: |
          set -uo pipefail
          shopt -s nullglob
          manifests=(spikes/*/Cargo.toml)
          if [ ${#manifests[@]} -eq 0 ]; then
            echo "OK: 无 spike manifest（spikes/ 下没有 Cargo.toml）—— 本 job 无检查对象，显式通过（不是静默跳过）"
            exit 0
          fi
          echo "发现 ${#manifests[@]} 个 spike manifest："
          printf '  %s\n' "${manifests[@]}"
          failed=0
          for m in "${manifests[@]}"; do
            echo "----- checking $m -----"
            if cargo deny --config deny.toml --manifest-path "$m" check licenses sources; then
              echo "OK: $m licenses / sources 通过"
            else
              echo "FAIL: $m licenses / sources 未通过"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "spike 依赖门禁失败：请在 docs/DEPENDENCIES.md 登记并确认许可证在白名单内（ADR-0024 D5）"
            exit 1
          fi
          echo "OK: 全部 ${#manifests[@]} 个 spike manifest 的 licenses / sources 均通过"

  # ==========================================================================
  # 硬门禁 #12b：文档一致性（ADR-0030）
  #
  # 检查对象（共 19 条规则；工具**只读**，不会自动改写任何文件）：
  #   ① MEMORY.md「各文件当前规模」表 ↔ docs/memory/ 的实测行数与条目数（ADR-0030 D1/D2，8 条）
  #   ② docs/adr/README.md 编号登记表 ↔ docs/adr/NNNN-*.md ↔ docs/memory/decisions.md（ADR-0030 D3，11 条）
  #
  # 为什么单独一道 job 而不并入 #12（hygiene）：hygiene 的规则总数已被 ADR-0025 钉死为 13
  #   （gov §5.4 的表格行数就是 SSOT），把这 19 条塞进去会立刻作废那个口径，并牵连 deferred.rs 的
  #   数量自洽测试；两者查的对象也不同 —— hygiene 查**源码形态**，本 job 查**文档之间的交叉一致性**。
  # 为什么用子编号 #12b（沿用 #8b 先例）：gov §5.1 的主编号被 tasks/TASK-001-repo-skeleton.md、
  #   xtask/src/deferred.rs、本文件与 plans/stage-1-pilots.md 交叉引用，重编号会造成大面积口径漂移。
  # 为什么两个子命令都跑完再判失败（而不是 set -e 一红就断）：一次运行要给审阅者**全部**发现项，
  #   否则「修一条、跑一次」等于把 CI 变成交互式调试器。
  # 负向验证（ADR-0019 元门禁，形式 N1）：memory_counts.rs / adr_index.rs 的单测里每条规则都有
  #   「不一致 → 必须产生 Error」的负向用例；登记表见 docs/adr/0019-hard-gate-negative-verification.md。
  # ==========================================================================
  doc-consistency:
    name: doc consistency (memory-counts + adr-index)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: "[HARD #12b] xtask memory-counts + adr-index"
        run: |
          set -uo pipefail
          failed=0
          cargo run -q -p xtask -- memory-counts || failed=1
          cargo run -q -p xtask -- adr-index || failed=1
          if [ "$failed" -ne 0 ]; then
            echo "文档一致性门禁失败：按上面每条发现项消息里的「处置」修正后重跑（工具只读，不会替你改文件）"
            exit 1
          fi
          echo "OK: MEMORY.md 规模表与 ADR 编号登记表均与实测一致"

  # ==========================================================================
  # 未实现项自检：确保 xtask 的"未实现"清单始终能被打印出来。
  #
  # 为什么值得单独一步：这张清单是防止「静默跳过检查」的唯一凭证。
  # 如果哪天它打印不出来了，说明有人把显式失败改成了静默成功。
  # ==========================================================================
  deferred-inventory:
    name: xtask deferred inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: print deferred inventory
        run: cargo run -p xtask -- --list-deferred
      - name: "verify unimplemented subcommand fails loudly (exit code 3)"
        run: |
          set +e
          cargo run -q -p xtask -- codegen
          code=$?
          set -e
          if [ "$code" -ne 3 ]; then
            echo "未实现的子命令必须以退出码 3 失败（铁律 1：无静默失败），实际 $code"
            exit 1
          fi
          echo "OK: 未实现子命令显式失败（exit 3）"
