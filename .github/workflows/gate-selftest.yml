# gate-selftest.yml — ADR-0019 的「元门禁」canary。
#
# 目的：证明硬门禁**在应该失败时确实会失败**。
#   主 CI 只能证明「这次是绿的」，而「绿灯」与「门禁根本没跑」在输出上可能无法区分。
#   真实事故（PL-016）：deny.toml 的 db-path 写成数组 → cargo-deny 配置解析失败
#   → 整条 deny 门禁形同虚设，却没有任何红灯。
#
# 触发：**仅 workflow_dispatch（手工）**。故意不配 schedule ——
#   GitHub 会在仓库 60 天无活动后自动停用定时工作流，那会造成
#   「以为每月在自检、其实早就停了」的静默失效，正是本 workflow 要消灭的东西。
#   规程（ADR-0019）：① 改动任何硬门禁后跑一次；② 每个阶段末评审跑一次，
#   并把运行编号记入 LEDGER.md。
#
# 覆盖范围：gov §5.1 #8（deny）与 #8b（spike-deny，ADR-0024 D2）。
#   fmt / clippy / build 的 canary 缺失，见 docs/PARKING_LOT.md PL-018（归 TASK-015）。
#
# 修改本文件的规则：新增 canary 段 = 正常演进（须在 ADR-0019 登记表补一行）；
#   删除或放宽断言 = 削弱护栏，属漂移触发器，需 ADR + 人类批准。

name: gate-selftest

on:
  workflow_dispatch:

permissions:
  contents: read

# 自检要看到每一次的结果，不做"新推送取消旧运行"
concurrency:
  group: gate-selftest
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # 三者必须同版本：本机开发环境 / 本 workflow / ci.yml 的 cargo-deny-action@v2.1.1。
  # 版本不一致会重现「本地红 CI 绿」（PL-016 的根因之一）。
  CARGO_DENY_VERSION: "0.20.2"

jobs:
  deny-gate:
    name: "deny 门禁负向验证 (ADR-0019 N3)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # 钉版本安装：release 二进制不可用时退回源码编译（慢，但本 job 是低频手工触发）
      - name: "install cargo-deny ${{ env.CARGO_DENY_VERSION }} (pinned)"
        run: |
          set -euo pipefail
          cargo install cargo-deny --version "$CARGO_DENY_VERSION" --locked
          cargo deny --version | tee /tmp/deny-version.txt
          grep -q "$CARGO_DENY_VERSION" /tmp/deny-version.txt
          echo "OK: cargo-deny 版本已钉定为 $CARGO_DENY_VERSION"

      # --- 正向：仓库里的 deny.toml 必须能被解析，且检查通过 ---
      # 只跑 licenses/bans/sources：advisories 需要联网 clone advisory-db，
      # 而本步的目的只是「证明 deny.toml 能被当前版本的 cargo-deny 正确加载」。
      - name: "positive: repo deny.toml parses and passes"
        run: |
          set -euo pipefail
          cargo deny check licenses bans sources
          echo "OK: 正向通过（deny.toml 解析成功，licenses / bans / sources 均 ok）"

      # --- 负向：已知坏配置必须让 cargo-deny 非零退出 ---
      # 坏样本就是 PL-016 的原始事故：db-path 写成数组。
      # 断言两层：① 退出码非零；② stderr 含 'expected a string'。
      # 只断言①的话，任何无关错误（网络、路径）都会让 canary「假绿」。
      - name: "negative: broken config must fail with 'expected a string'"
        run: |
          set -uo pipefail
          broken="$(mktemp -d)/broken-deny.toml"
          printf '[advisories]\ndb-path = ["target/deny-db"]\n' > "$broken"
          # ⚠ 不要写成 out="$(cargo deny ...)"; code=$? —— GitHub Actions 用 `bash -eo pipefail`
          #   执行 run 脚本（隐式 -e），而「赋值 + 命令替换」失败时会触发 -e 当场中止脚本：
          #   于是 code=$? 与后面所有断言根本不会执行，负向验证退化成「永远红」的假红。
          #   2026-09-24 首次真跑（run_number=1）即死于此。条件位置的命令不受 -e 影响，
          #   故用 if/else 完整捕获退出码。同形修复见本文件 spike-deny-gate 的负向步。
          if out="$(cargo deny --config "$broken" check licenses bans sources 2>&1)"; then
            code=0
          else
            code=$?
          fi
          echo "----- cargo-deny output (exit=$code) -----"
          echo "$out"
          echo "------------------------------------------"
          if [ "$code" -eq 0 ]; then
            echo "FAIL: 坏配置竟然通过了 —— deny 门禁的负向验证不成立 (ADR-0019)"
            exit 1
          fi
          if ! echo "$out" | grep -q "expected a string"; then
            echo "FAIL: 失败原因不是配置解析错误 —— canary 断言与真实故障模式脱钩 (ADR-0019)"
            exit 1
          fi
          echo "OK: 负向通过（exit=$code，stderr 含 'expected a string'）"
  # ==========================================================================
  # spike-deny 门禁的负向验证（ADR-0024 D2 + ADR-0019 N3）
  #
  # 要证明的命题：ci.yml 的 spike-deny job 在「spike 引入了许可证不兼容的依赖」时真的会红，
  #   而不是「没找到 manifest / 配置读不进来 → 什么都没查 → 显示通过」。
  # 为什么用本地 path 依赖 + 假 GPL 许可证：不需要联网，也不需要真的发布一个坏 crate；
  #   licenses 检查只读依赖自己的 Cargo.toml 里的 license 字段，因此一个本地 fixture 就够了。
  # ==========================================================================
  spike-deny-gate:
    name: "spike-deny 门禁负向验证 (ADR-0024 D2 / ADR-0019 N3)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: "install cargo-deny (pinned)"
        run: |
          set -euo pipefail
          cargo install cargo-deny --version "$CARGO_DENY_VERSION" --locked
          cargo deny --version

      # --- 正向：仓库当前状态（含真实的 spikes/）必须通过，且行为与 ci.yml 完全一致 ---
      # 关键：必须复刻 ci.yml 的「无 manifest 时显式打印」分支，否则 canary 与真门禁行为不同，
      #       canary 绿了也不能证明真门禁是好的。
      - name: "positive: replicate ci.yml spike-deny logic on the real repo"
        run: |
          set -uo pipefail
          shopt -s nullglob
          manifests=(spikes/*/Cargo.toml)
          if [ ${#manifests[@]} -eq 0 ]; then
            echo "OK: 正向 —— 当前无 spike manifest，ci.yml 的逻辑会显式打印并通过"
            exit 0
          fi
          failed=0
          for m in "${manifests[@]}"; do
            cargo deny --config deny.toml --manifest-path "$m" check licenses sources || failed=1
          done
          if [ "$failed" -ne 0 ]; then
            echo "FAIL: 正向断言不成立 —— 仓库当前的 spike 依赖本身就过不了门禁，先修仓库再谈 canary"
            exit 1
          fi
          echo "OK: 正向通过（${#manifests[@]} 个 spike manifest 的 licenses / sources 均 ok）"

      # --- 负向：注入一个 GPL 许可的本地 path 依赖，断言 licenses 检查变红 ---
      - name: "negative: GPL-licensed spike dependency must fail the licenses check"
        run: |
          set -uo pipefail
          bad="$(mktemp -d)/spikes/spike-canary-bad"
          mkdir -p "$bad/src" "$bad/deps/gpl-fixture/src"
          cat > "$bad/deps/gpl-fixture/Cargo.toml" <<'TOML'
          [package]
          name = "gpl-fixture"
          version = "0.1.0"
          edition = "2021"
          license = "GPL-3.0-only"
          TOML
          echo "// fixture" > "$bad/deps/gpl-fixture/src/lib.rs"
          cat > "$bad/Cargo.toml" <<'TOML'
          [package]
          name = "spike-canary-bad"
          version = "0.1.0"
          edition = "2021"
          license = "MIT"

          [dependencies]
          gpl-fixture = { path = "deps/gpl-fixture" }
          TOML
          echo "// fixture" > "$bad/src/main.rs"
          # 用仓库根的 deny.toml（白名单里没有 GPL-3.0-only）
          # 同形修复：见 deny-gate job 负向步的详细说明 —— GitHub 的隐式 -e 会让
          #   out="$(...)"; code=$? 在赋值那一行就中止脚本（2026-09-24 run_number=1 的失败原因）。
          if out="$(cargo deny --config deny.toml --manifest-path "$bad/Cargo.toml" check licenses sources 2>&1)"; then
            code=0
          else
            code=$?
          fi
          echo "----- cargo-deny output (exit=$code) -----"
          echo "$out"
          echo "------------------------------------------"
          if [ "$code" -eq 0 ]; then
            echo "FAIL: GPL 依赖竟然通过了 —— spike-deny 门禁的负向验证不成立 (ADR-0024 D2)"
            exit 1
          fi
          # 断言钉在 cargo-deny 0.20.2 的**具体故障文本**上（ADR-0019：断言不能与故障模式脱钩）。
          # 本机 2026-09-18 实测该 fixture 的输出为：
          #   error[rejected]: failed to satisfy license requirements
          #     5 | license = "GPL-3.0-only"
          #       |            rejected: license is not explicitly allowed
          #   licenses FAILED, sources ok          -> exit code 4
          if ! echo "$out" | grep -q "license is not explicitly allowed"; then
            echo "FAIL: 失败原因不是许可证白名单拒绝 —— canary 断言与真实故障模式脱钩 (ADR-0019)"
            exit 1
          fi
          if ! echo "$out" | grep -q "GPL-3.0-only"; then
            echo "FAIL: 输出未指名被拒的许可证 —— 断言不够具体 (ADR-0019)"
            exit 1
          fi
          echo "OK: 负向通过（exit=$code，输出含 'license is not explicitly allowed' 与 'GPL-3.0-only'）"
