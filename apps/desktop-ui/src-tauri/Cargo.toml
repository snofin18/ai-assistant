[package]
name = "assistant-desktop-ui"
version = "0.1.0"
description = "Tauri 2 shell for the local AI assistant."
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "assistant_desktop_ui"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The Tauri shell is intentionally a separate workspace so the root
# `cargo test --workspace` does not require Linux WebKit development packages.
[workspace]
