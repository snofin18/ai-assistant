[package]
name = "assistant-agent-core"
description = "Binary-layer Host assembly for the local AI assistant."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Third-party dependencies are already registered in docs/DEPENDENCIES.md.
# `tokio` is required by ToolBus::start; `thiserror` gives structured assembly
# errors; `serde_json` is used only by the tool-bus call boundary.
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
thiserror = "2"
serde_json = "1.0"
serde = { version = "1", features = ["derive"] }

[dependencies.assistant-core]
path = "../../crates/core"
version = "0.1.0"

[dependencies.assistant-storage]
path = "../../crates/storage"
version = "0.1.0"

[dependencies.assistant-audit]
path = "../../crates/audit"
version = "0.1.0"

[dependencies.assistant-policy]
path = "../../crates/policy"
version = "0.1.0"

[dependencies.assistant-tool-bus]
path = "../../crates/tool-bus"
version = "0.1.0"

[dependencies.assistant-model-gateway]
path = "../../crates/model-gateway"
version = "0.1.0"

[dependencies.assistant-platform-windows]
path = "../../crates/platform/windows"
version = "0.1.0"

[dependencies.assistant-platform-api]
path = "../../crates/platform/api"
version = "0.1.0"

[dependencies.assistant-protocol]
path = "../../crates/protocol"
version = "0.1.0"

[dependencies.assistant-task-engine]
path = "../../crates/task-engine"
version = "0.1.0"

[dependencies.assistant-verify]
path = "../../crates/verify"
version = "0.1.0"

[dependencies.assistant-ipc]
# ADR-0057: the Core-side UI command listener owns the transport end of the
# UI↔Core contract. Workspace dependency, not a new third-party crate.
path = "../../crates/ipc"
version = "0.1.0"

[dependencies.assistant-hitl]
# ADR-0060 D4: the reserved `request_approval` step is the binary layer's
# approval entry point, so the binary layer links the HITL crate. Workspace
# dependency, not a new third-party crate (ADR-0053 D3 blacklists `hitl` for
# `crates/core`, not for the assembly point).
path = "../../crates/hitl"
version = "0.1.0"

[dependencies.assistant-undo]
# ADR-0062 D4/D5: the binary layer implements the `crates/undo`
# `RollbackExecutor` port for Notepad. Workspace dependency, not a new
# third-party crate (ADR-0053 D3 blacklists `undo` for `crates/core`, not for
# the assembly point).
path = "../../crates/undo"
version = "0.1.0"

[target.'cfg(windows)'.dev-dependencies.windows]
# Leak-audit measurement (ADR-0063): the ignored convergence test samples its
# own working set and handle count. `windows` is already an approved dependency
# (`docs/DEPENDENCIES.md`); this only enables the ProcessStatus feature for the
# test target.
version = "=0.62.2"
features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"]

[lints]
workspace = true
